<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title></title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #000;
            }

            video {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center;
            }
        </style>
    </head>

    <body>
        <video autoplay muted loop playsinline aria-hidden="true" tabindex="-1">
            <source src="backgroundVideo.mov" type="video/quicktime">
            <source src="backgroundVideo.mp4" type="video/mp4">
        </video>
    </body>
</html>
